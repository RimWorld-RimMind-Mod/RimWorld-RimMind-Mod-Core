name: CI & Architecture Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (1.6 & 1.7) & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Normalize Workspace Directory Alias
        run: |
          if [ ! -e "../RimMind-Core" ]; then
            ln -s "$GITHUB_WORKSPACE" "../RimMind-Core"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build Mod (1.6 & 1.7)
        run: |
          dotnet build Source/Domain/RimMindCore.Domain.csproj --configuration Release -warnaserror
          dotnet build Source/Application/RimMindCore.Application.csproj --configuration Release -warnaserror
          dotnet build Source/RimMindCore.csproj --configuration Release -p:GameVersion=1.6 -warnaserror
          dotnet build Source/RimMindCore.csproj --configuration Release -p:GameVersion=1.7 -warnaserror

      - name: Run Unit Tests
        run: dotnet test Tests/RimMindCore.Tests.csproj --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test IntegrationTests/RimMindCore.Integration.Tests.csproj --configuration Release --verbosity normal

      - name: Run Architecture Tests
        run: dotnet test ArchTests/RimMindCore.ArchTests.csproj --configuration Release --verbosity normal
